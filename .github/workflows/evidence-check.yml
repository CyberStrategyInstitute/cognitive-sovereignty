name: CSF evidence checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python tools/csf.py check
      - run: python -m tools.event_monitor check
      - run: python -m tools.signals check
      - run: python -m tools.export check
      - run: python -m tools.version
      - run: python -m tools.check_repo
      - run: python -m tools.lens_check
      - run: python -m unittest discover -s tests
      - run: node tests/check_dashboards.cjs
      - run: python -m tools.build
      - run: git diff --exit-code
      - run: python tools/csf.py report --output monitoring/latest.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csf-evidence-report
          path: |
            monitoring/latest.md
            monitoring/latest.json
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r integration/requirements-mcp.txt
      - run: python tests/check_mcp.py
